services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nativestream-server
    restart: unless-stopped
    ports:
      - "8888:8888" # Lan Reachable so other devices can manually enter this machine's IP
                    # to pair. mDNS autodiscovery is not expected to work through Docker's 
                    # default bridge network.
    volumes:
      - ./config/config.yaml:/config/config.yaml:ro
      - nativestream-data:/data
    environment:
      - NATIVESTREAM_CONFIG=/config/config.yaml
      - NATIVESTREAM_DATA=/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nativestream-data:
    driver: local