syntax = "proto3";

package stream.v1;
option go_package = "github.com/fredrick-karuri/nativestream/sdk-gen/go/stream/v1;streamv1";

import "google/protobuf/timestamp.proto";

// ── Health ──────────────────────────────────────────────────────────────────

message HealthResponse {
  string status = 1;
  string uptime = 2;
  int32 channels = 3;
  int32 healthy = 4;
  optional google.protobuf.Timestamp last_probe = 5;
  string version = 6;
  optional string server_name = 7;
  optional string addr = 8;
}

// ── Channel list ──────────────────────────────────────────────────────────────

message ChannelResponse {
  string id = 1;
  string name = 2;
  string group_title = 3;
  string tvg_id = 4;
  string logo_url = 5;
  bool healthy = 6;
  double active_score = 7;
  int32 candidate_count = 8;
  bool has_active_link = 9;
}

message ChannelListResponse {
  repeated ChannelResponse channels = 1;
}

// ── Channel detail ────────────────────────────────────────────────────────────

message ChannelDetailResponse {
  string id = 1;
  string name = 2;
  string group_title = 3;
  string tvg_id = 4;
  string logo_url = 5;
  repeated string keywords = 6;
  optional LinkScoreResponse active_link = 7;
  repeated LinkScoreResponse candidates = 8;
}

message LinkScoreResponse {
  string url = 1;
  double score = 2;
  int32 latency_ms = 3;
  string state = 4;
  int32 fail_count = 5;
  map<string, string> headers = 6;
  optional string failure_reason = 7;
}

// ── Mutations ─────────────────────────────────────────────────────────────────

// NOTE: stream_headers added here to match UpdateChannelRequest.
// Fixes a real drift found during T1.2 drafting: Create previously had
// no way to set headers even though Update did on all three platforms.
message CreateChannelRequest {
  string name = 1;
  string group_title = 2;
  string tvg_id = 3;
  string logo_url = 4;
  string stream_url = 5;
  repeated string keywords = 6;
  map<string, string> stream_headers = 7;
}

message UpdateChannelRequest {
  optional string name = 1;
  optional string group_title = 2;
  optional string stream_url = 3;
  repeated string keywords = 4;
  map<string, string> stream_headers = 5;
}

// ── Generic ───────────────────────────────────────────────────────────────────

message StatusResponse {
  string status = 1;
}